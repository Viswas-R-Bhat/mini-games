<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReAIvive — The AI Resurrection Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04060b;
      --surface: #0a0f1a;
      --primary: #4fffb0;
      --primary-glow: rgba(79, 255, 176, 0.3);
      --accent: #ff6b35;
      --text: #f0f2f5;
      --muted: #8a99b0;
      --border: #1a2438;
      --ff-display: 'Bebas Neue', sans-serif;
      --ff-body: 'Plus Jakarta Sans', sans-serif;
      --ff-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Cyber Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
      z-index: 0;
      animation: grid-move 20s linear infinite;
    }

    @keyframes grid-move {
      from { background-position: 0 0; }
      to { background-position: 50px 50px; }
    }

    .glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(80px);
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
    }

    .title-wrap {
      margin-bottom: 4rem;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
    }

    .title {
      font-family: var(--ff-display);
      font-size: clamp(5rem, 15vw, 10rem);
      line-height: 0.8;
      letter-spacing: 0.05em;
      color: var(--primary);
      text-shadow: 0 0 30px var(--primary-glow);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-family: var(--ff-mono);
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4em;
    }

    .button-group {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    .btn {
      padding: 1.2rem 3rem;
      font-family: var(--ff-display);
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      min-width: 220px;
    }

    .btn-participant {
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .btn-participant:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 40px var(--primary-glow);
    }

    .btn-admin {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-admin:hover {
      background: rgba(79, 255, 176, 0.1);
      transform: translateY(-5px);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Scanline effect */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  
  <div class="container">
    <div class="title-wrap">
      <h1 class="title">REAI<span style="color: white;">VIVE</span></h1>
      <p class="subtitle">The AI Resurrection Challenge</p>
    </div>

    <div class="button-group">
      <a href="games_list.html" class="btn btn-participant">PARTICIPANT</a>
      <a href="pages/admin.html" class="btn btn-admin">ADMIN PANEL</a>
    </div>
  </div>
</body>
</html>
